name: MATLAB CI (Build & Test)

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  lint:
    name: Style Suggestions
    runs-on: ubuntu-latest
    continue-on-error: true # Keeps the badge green even if code isn't perfectly "MATLAB-esque"
    steps:
      - name: Check out website code
        uses: actions/checkout@v4
        with:
          path: website_code

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run MATLAB Linter (checkcode)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            % Recursively find and lint all .m files for edification
            mFiles = dir(fullfile('website_code', '**', '*.m'));
            for i = 1:length(mFiles)
              filePath = fullfile(mFiles(i).folder, mFiles(i).name);
              diag = checkcode(filePath, '-all');
              if isempty(diag)
                fprintf('Linting: %s [CLEAN]\n', mFiles(i).name);
              else
                fprintf('Linting: %s [%d issues found]\n', mFiles(i).name, length(diag));
                disp(struct2table(diag)); % Table format is much easier to read in logs
              end
            end
  build-and-test:
    name: Physics Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: website_code }
      - uses: actions/checkout@v4
        with:
          repository: jdschmidt-opticalscientist/bookCode
          token: ${{ secrets.BOOK_CODE_TOKEN }}
          path: core_book_code

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run All Examples
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath('core_book_code'));
            addpath(genpath('website_code'));

            % Prevent pop-up windows in the headless runner
            set(0, 'DefaultFigureVisible', 'off'); 

            % Use a very specific name to avoid collision with your physics variables
            CI_TEST_LIST = dir(fullfile(pwd, 'website_code', 'examples', '**', 'check*.m'));

            for k = 1:length(CI_TEST_LIST)
                testPath = fullfile(CI_TEST_LIST(k).folder, CI_TEST_LIST(k).name);
                [~, testName] = fileparts(CI_TEST_LIST(k).name);
                
                fprintf('--- Running Test (%d/%d): %s ---\n', k, length(CI_TEST_LIST), testName);
                
                try
                    % Run in a way that protects our loop variables from 'clear'
                    % We change directory, run the script, and return
                    origDir = pwd;
                    cd(CI_TEST_LIST(k).folder);
                    
                    run(testName);
                    
                    % Save figure if one exists
                    if ~isempty(get(0, 'Children'))
                        saveas(gcf, [testName '.png']);
                        fprintf('Result saved: %s.png\n', testName);
                    end
                    
                    cd(origDir);
                catch ME
                    fprintf('FAILURE in %s: %s\n', testName, ME.message);
                    % We'll rethrow at the end or exit to signal failure
                    error('CI test failed on script: %s', testName);
                end
            end
      - name: Archive Results
        uses: actions/upload-artifact@v4
        if: always() # Upload even if a test fails
        with:
          name: simulation-results
          path: website_code/examples/**/*.png
