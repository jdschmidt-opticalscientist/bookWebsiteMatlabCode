name: MATLAB CI (Build & Test)

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  lint:
    name: Style Suggestions
    runs-on: ubuntu-latest
    continue-on-error: true # Keeps the badge green even if code isn't perfectly "MATLAB-esque"
    steps:
      - name: Check out website code
        uses: actions/checkout@v4
        with:
          path: website_code

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run MATLAB Linter (checkcode)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            % Recursively find and lint all .m files for edification
            mFiles = dir(fullfile('website_code', '**', '*.m'));
            for i = 1:length(mFiles)
                filePath = fullfile(mFiles(i).folder, mFiles(i).name);
                fprintf('Linting: %s\n', mFiles(i).name);
                diag = checkcode(filePath, '-all');
                if ~isempty(diag), disp(diag); end
            end

  build-and-test:
    name: Physics Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out website code (Public)
        uses: actions/checkout@v4
        with:
          path: website_code

      - name: Check out book code (Private)
        uses: actions/checkout@v4
        with:
          repository: jdschmidt-opticalscientist/bookCode
          token: ${{ secrets.BOOK_CODE_TOKEN }}
          path: core_book_code

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run Master Simulation
        uses: matlab-actions/run-command@v2
        with:
          command: |
            % 1. Setup paths dynamically (avoids local startup.m conflicts)
            addpath(genpath('core_book_code'));
            addpath(genpath('website_code'));

            % 2. Verify visibility
            if exist('ft2', 'file')
                fprintf('SUCCESS: Private book functions are in the path.\n');
            else
                error('FAILURE: Private book functions not found.');
            end

            % 3. Functional Test: Run an example and catch errors
            try
                fprintf('Executing checkXcorr...\n');
                cd('website_code/examples/Chapter3/basicCorrelation');
                checkXcorr; 
                fprintf('SUCCESS: checkXcorr executed without errors.\n');
            catch ME
                fprintf('FAILURE: checkXcorr crashed with error: %s\n', ME.message);
                rethrow(ME); % Fails the action while preserving the stack trace
            end
