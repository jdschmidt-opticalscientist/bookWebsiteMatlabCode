name: MATLAB CI (Build & Test)

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  lint:
    name: Style Suggestions
    runs-on: ubuntu-latest
    continue-on-error: true # Keeps the badge green even if code isn't perfectly "MATLAB-esque"
    steps:
      - name: Check out website code
        uses: actions/checkout@v4
        with:
          path: website_code

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run MATLAB Linter (checkcode)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            % Recursively find and lint all .m files for edification
            mFiles = dir(fullfile('website_code', '**', '*.m'));
            for i = 1:length(mFiles)
              filePath = fullfile(mFiles(i).folder, mFiles(i).name);
              diag = checkcode(filePath, '-all');
              if isempty(diag)
                fprintf('Linting: %s [CLEAN]\n', mFiles(i).name);
              else
                fprintf('Linting: %s [%d issues found]\n', mFiles(i).name, length(diag));
                disp(struct2table(diag)); % Table format is much easier to read in logs
              end
            end
  build-and-test:
    name: Physics Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: website_code }
      - uses: actions/checkout@v4
        with:
          repository: jdschmidt-opticalscientist/bookCode
          token: ${{ secrets.BOOK_CODE_TOKEN }}
          path: core_book_code

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run All Examples (Isolated)
        shell: bash
        run: |
          # 1. Find all example scripts starting with 'check'
          # We use find to grab everything recursively
          mapfile -t SCRIPTS < <(find website_code/examples -name "check*.m")

          for SCRIPT_PATH in "${SCRIPTS[@]}"; do
            DIR_NAME=$(dirname "$SCRIPT_PATH")
            FILE_NAME=$(basename "$SCRIPT_PATH" .m)
            
            echo "------------------------------------------------------------"
            echo "TESTING: $FILE_NAME in $DIR_NAME"
            echo "------------------------------------------------------------"

            # 2. Run MATLAB in 'batch' mode
            # Each 'matlab -batch' call is a fresh OS process. 
            # A 'clear' inside the script cannot kill this Bash loop.
            matlab -batch "
              addpath(genpath('core_book_code'));
              addpath(genpath('website_code'));
              cd('$DIR_NAME');
              
              try
                  % Run the example
                  $FILE_NAME;
                  
                  % 3. Save a figure if one was generated
                  if ~isempty(get(0, 'Children'))
                      saveas(gcf, fullfile('${{ github.workspace }}', '$FILE_NAME.png'));
                  end
                  fprintf('SUCCESS: $FILE_NAME completed.\n');
              catch ME
                  fprintf('FAILURE: $FILE_NAME crashed with error: %s\n', ME.message);
                  exit(1); % This tells Bash the test failed
              end
            "
          done

      - name: Upload Simulation Plots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-plots
          path: "*.png"
